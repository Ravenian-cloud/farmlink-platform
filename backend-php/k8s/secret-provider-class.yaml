apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: farmlink-api-secrets
  namespace: farmlink
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_APP_KEY/versions/latest"
        path: "APP_KEY"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_JWT_SECRET/versions/latest"
        path: "JWT_SECRET"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_DB_PASSWORD/versions/latest"
        path: "DB_PASSWORD"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_SHORTCODE/versions/latest"
        path: "MPESA_SHORTCODE"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_CONSUMER_KEY/versions/latest"
        path: "MPESA_CONSUMER_KEY"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_CONSUMER_SECRET/versions/latest"
        path: "MPESA_CONSUMER_SECRET"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_PASSKEY/versions/latest"
        path: "MPESA_PASSKEY"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_WEATHER_WEBHOOK_SECRET/versions/latest"
        path: "WEATHER_WEBHOOK_SECRET"

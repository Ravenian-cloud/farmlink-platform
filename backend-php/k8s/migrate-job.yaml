apiVersion: batch/v1
kind: Job
metadata:
  name: farmlink-migrate-RELEASE_SHA
  namespace: farmlink
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: farmlink-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - "--structured-logs"
            - "--private-ip"
            - "--port=5432"
            - "PROJECT_ID:REGION:INSTANCE_NAME"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: migrate
          image: REGION-docker.pkg.dev/PROJECT_ID/farmlink/backend:RELEASE_SHA
          args: ["php", "artisan", "migrate", "--force", "--no-interaction"]
          envFrom:
            - configMapRef:
                name: farmlink-api-config
          volumeMounts:
            - name: secrets-store
              mountPath: /var/run/secrets/farmlink
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: farmlink-api-secrets

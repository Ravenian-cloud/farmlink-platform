apiVersion: v1
kind: Namespace
metadata:
  name: farmlink
  labels:
    app.kubernetes.io/part-of: farmlink
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: farmlink-api
  namespace: farmlink
  annotations:
    iam.gke.io/gcp-service-account: farmlink-api@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: farmlink-api-config
  namespace: farmlink
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://api.example.com
  APP_LOCALE: en
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  DB_DATABASE: farmlink
  DB_USERNAME: farmlink_app
  DB_SSLMODE: prefer
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SESSION_DRIVER: file
  CORS_ALLOWED_ORIGINS: https://app.example.com
  MPESA_ENVIRONMENT: production
  MPESA_CALLBACK_URL: https://api.example.com/api/v1/webhooks/mpesa
  PREMIUM_MONTHLY_MINOR: "0"
  AD_CAMPAIGN_MONTHLY_MINOR: "0"
  AD_ADMIN_IDS: ""
  KYC_ADMIN_IDS: ""
  COMMUNITY_ADMIN_IDS: ""

apiVersion: v1
kind: Namespace
metadata:
  name: farmlink-staging
  labels:
    app.kubernetes.io/part-of: farmlink
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: farmlink-api
  namespace: farmlink-staging
  annotations:
    iam.gke.io/gcp-service-account: farmlink-staging-api@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: farmlink-api-config
  namespace: farmlink-staging
data:
  APP_ENV: staging
  APP_DEBUG: "false"
  APP_URL: https://staging-api.example.com
  APP_LOCALE: en
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  DB_DATABASE: farmlink
  DB_USERNAME: farmlink_app
  DB_SSLMODE: prefer
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SESSION_DRIVER: file
  CORS_ALLOWED_ORIGINS: https://staging-api.example.com
  MPESA_ENVIRONMENT: sandbox
  MPESA_CALLBACK_URL: https://staging-api.example.com/api/v1/webhooks/mpesa
  PREMIUM_MONTHLY_MINOR: "0"
  AD_CAMPAIGN_MONTHLY_MINOR: "0"
  AD_ADMIN_IDS: REPLACE_WITH_AD_ADMIN_UUIDS
  KYC_ADMIN_IDS: REPLACE_WITH_KYC_ADMIN_UUIDS
  COMMUNITY_ADMIN_IDS: REPLACE_WITH_COMMUNITY_ADMIN_UUIDS
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: farmlink-api-secrets
  namespace: farmlink-staging
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_APP_KEY_STAGING/versions/latest"
        path: "APP_KEY"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_JWT_SECRET_STAGING/versions/latest"
        path: "JWT_SECRET"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_DB_PASSWORD_STAGING/versions/latest"
        path: "DB_PASSWORD"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_SHORTCODE_STAGING/versions/latest"
        path: "MPESA_SHORTCODE"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_CONSUMER_KEY_STAGING/versions/latest"
        path: "MPESA_CONSUMER_KEY"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_CONSUMER_SECRET_STAGING/versions/latest"
        path: "MPESA_CONSUMER_SECRET"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_PASSKEY_STAGING/versions/latest"
        path: "MPESA_PASSKEY"
      - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_WEATHER_WEBHOOK_SECRET_STAGING/versions/latest"
        path: "WEATHER_WEBHOOK_SECRET"

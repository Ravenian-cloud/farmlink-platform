apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: farmlink-staging
resources:
  - ../production.yaml
  - ../secret-provider-class.yaml
patches:
  - target:
      version: v1
      kind: Namespace
      name: farmlink
    patch: |-
      - op: replace
        path: /metadata/name
        value: farmlink-staging
  - target:
      version: v1
      kind: ConfigMap
      name: farmlink-api-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: staging
      - op: replace
        path: /data/APP_URL
        value: https://staging-api.example.com
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: https://staging-api.example.com
      - op: replace
        path: /data/MPESA_ENVIRONMENT
        value: sandbox
      - op: replace
        path: /data/MPESA_CALLBACK_URL
        value: https://staging-api.example.com/api/v1/webhooks/mpesa
      - op: replace
        path: /data/AD_ADMIN_IDS
        value: REPLACE_WITH_AD_ADMIN_UUIDS
      - op: replace
        path: /data/KYC_ADMIN_IDS
        value: REPLACE_WITH_KYC_ADMIN_UUIDS
      - op: replace
        path: /data/COMMUNITY_ADMIN_IDS
        value: REPLACE_WITH_COMMUNITY_ADMIN_UUIDS
  - target:
      version: v1
      kind: ServiceAccount
      name: farmlink-api
    patch: |-
      - op: replace
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: farmlink-staging-api@PROJECT_ID.iam.gserviceaccount.com
  - target:
      group: secrets-store.csi.x-k8s.io
      version: v1
      kind: SecretProviderClass
      name: farmlink-api-secrets
    patch: |-
      - op: replace
        path: /spec/parameters/secrets
        value: |-
          - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_APP_KEY_STAGING/versions/latest"
            path: "APP_KEY"
          - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_JWT_SECRET_STAGING/versions/latest"
            path: "JWT_SECRET"
          - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_DB_PASSWORD_STAGING/versions/latest"
            path: "DB_PASSWORD"
          - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_SHORTCODE_STAGING/versions/latest"
            path: "MPESA_SHORTCODE"
          - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_CONSUMER_KEY_STAGING/versions/latest"
            path: "MPESA_CONSUMER_KEY"
          - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_CONSUMER_SECRET_STAGING/versions/latest"
            path: "MPESA_CONSUMER_SECRET"
          - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_MPESA_PASSKEY_STAGING/versions/latest"
            path: "MPESA_PASSKEY"
          - resourceName: "projects/PROJECT_ID/secrets/FARMLINK_WEATHER_WEBHOOK_SECRET_STAGING/versions/latest"
            path: "WEATHER_WEBHOOK_SECRET"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: farmlink-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: farmlink-api
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: cloud-sql-proxy
                args:
                  - "--structured-logs"
                  - "--private-ip"
                  - "--port=5432"
                  - "PROJECT_ID:REGION:STAGING_INSTANCE_NAME"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: farmlink-queue
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: farmlink-queue
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: cloud-sql-proxy
                args:
                  - "--structured-logs"
                  - "--private-ip"
                  - "--port=5432"
                  - "PROJECT_ID:REGION:STAGING_INSTANCE_NAME"
  - target:
      group: batch
      version: v1
      kind: CronJob
      name: farmlink-scheduler
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: farmlink-scheduler
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                initContainers:
                  - name: cloud-sql-proxy
                    args:
                      - "--structured-logs"
                      - "--private-ip"
                      - "--port=5432"
                      - "PROJECT_ID:REGION:STAGING_INSTANCE_NAME"
  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
      name: farmlink-api
    patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: farmlink-api
      spec:
        minReplicas: 1
        maxReplicas: 3
  - target:
      version: v1
      kind: ManagedCertificate
      name: farmlink-api-cert
    patch: |-
      - op: replace
        path: /spec/domains/0
        value: staging-api.example.com
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: farmlink-api
    patch: |-
      - op: replace
        path: /metadata/annotations/kubernetes.io~1ingress.global-static-ip-name
        value: farmlink-staging-api-ip
      - op: replace
        path: /spec/rules/0/host
        value: staging-api.example.com
